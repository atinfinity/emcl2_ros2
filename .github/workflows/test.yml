name: test

on:
  push:
    branches:
      - jazzy
    paths-ignore:
    - '**.md'
  pull_request:
    branches:
      - jazzy
    paths-ignore:
    - '**.md'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: osrf/ros:jazzy-desktop-full
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          mkdir -p /root/ros2_ws/src
          cp -r $GITHUB_WORKSPACE /root/ros2_ws/src/emcl2_ros2
          cd /root/ros2_ws
          source /opt/ros/$ROS_DISTRO/setup.bash
          apt update
          rosdep update
          rosdep install -i -y --from-path src --rosdistro $ROS_DISTRO
          colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_BENCHMARK=ON
        shell: bash
      - name: Test
        run: |
          cd /root/ros2_ws
          source /opt/ros/$ROS_DISTRO/setup.bash
          colcon test
          colcon test-result --verbose
        shell: bash
      - name: Composition smoke test
        run: |
          cd /root/ros2_ws
          source /opt/ros/$ROS_DISTRO/setup.bash
          source install/setup.bash
          bash install/emcl2/share/emcl2/test/composition_smoke_test.sh
        shell: bash

  test-asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: osrf/ros:jazzy-desktop-full
    steps:
      - uses: actions/checkout@v5
      - name: Build with AddressSanitizer
        run: |
          mkdir -p /root/ros2_ws/src
          cp -r $GITHUB_WORKSPACE /root/ros2_ws/src/emcl2_ros2
          cd /root/ros2_ws
          source /opt/ros/$ROS_DISTRO/setup.bash
          apt update
          rosdep update
          rosdep install -i -y --from-path src --rosdistro $ROS_DISTRO
          colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZER=ON
        shell: bash
      - name: Leak check (gtest under ASan/LSan)
        run: |
          cd /root/ros2_ws
          source /opt/ros/$ROS_DISTRO/setup.bash
          colcon test --ctest-args -R test_emcl2
          colcon test-result --verbose
        shell: bash

  localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: osrf/ros:jazzy-desktop-full
    permissions:
      contents: write        # push the plots to the ci-assets branch
      pull-requests: write    # post the evo result comment
    steps:
      - uses: actions/checkout@v5
      - name: Build and install dependencies
        run: |
          mkdir -p /root/ros2_ws/src
          cp -r $GITHUB_WORKSPACE /root/ros2_ws/src/emcl2_ros2
          cd /root/ros2_ws
          source /opt/ros/$ROS_DISTRO/setup.bash
          apt update
          rosdep update
          rosdep install -i -y --from-path src --rosdistro $ROS_DISTRO
          apt install -y \
            ros-$ROS_DISTRO-nav2-minimal-tb3-sim \
            ros-$ROS_DISTRO-nav2-bringup \
            python3-pip libgl1-mesa-dri libegl-mesa0 libglx-mesa0
          pip3 install --break-system-packages evo
          colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release
        shell: bash
      - name: Run localization evaluation (headless sim + emcl2 vs ground truth)
        run: |
          cd /root/ros2_ws
          source /opt/ros/$ROS_DISTRO/setup.bash
          source install/setup.bash
          export PATH="$HOME/.local/bin:$PATH"
          export HEADLESS_RENDERING=true
          export OUTPUT_DIR=/root/ros2_ws/localization_eval_output
          bash install/emcl2/share/emcl2/test/run_localization_eval.sh
        shell: bash
      - name: Upload evo results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-eval
          path: /root/ros2_ws/localization_eval_output/
          if-no-files-found: warn
      - name: Post evo result to the PR
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          OUTPUT_DIR: /root/ros2_ws/localization_eval_output
        run: python3 $GITHUB_WORKSPACE/test/post_localization_eval.py
        shell: bash
      - name: Run recovery scenarios (global localization + wrong initial pose)
        # Informational: measures how well/fast emcl2 recovers a correct pose
        # from a wrong / uniform belief. Convergence is stochastic, so run each
        # scenario RECOVERY_RUNS times and report success rate + medians. A
        # non-convergence is a result, not a failure, so this must not gate.
        continue-on-error: true
        env:
          RECOVERY_RUNS: "3"
        run: |
          cd /root/ros2_ws
          source /opt/ros/$ROS_DISTRO/setup.bash
          source install/setup.bash
          export PATH="$HOME/.local/bin:$PATH"
          export HEADLESS_RENDERING=true
          CFG=/root/ros2_ws/install/emcl2/share/emcl2/config
          for i in $(seq 1 "$RECOVERY_RUNS"); do
            echo "== scenario A run $i/$RECOVERY_RUNS: uniform global localization =="
            SCENARIO=recovery TRIGGER_GLOBAL_LOC=true \
              PARAMS_FILE=$CFG/emcl2_recovery.param.yaml \
              OUTPUT_DIR=/root/ros2_ws/recovery_a/run$i \
              bash install/emcl2/share/emcl2/test/run_localization_eval.sh || true
            echo "== scenario B run $i/$RECOVERY_RUNS: kidnapped-at-start =="
            SCENARIO=recovery TRIGGER_GLOBAL_LOC=false \
              PARAMS_FILE=$CFG/emcl2_recovery_wrong_init.param.yaml \
              OUTPUT_DIR=/root/ros2_ws/recovery_b/run$i \
              bash install/emcl2/share/emcl2/test/run_localization_eval.sh || true
          done
          export MPLBACKEND=Agg
          python3 $GITHUB_WORKSPACE/test/plot_convergence.py \
            /root/ros2_ws/recovery_a /root/ros2_ws/recovery_a/convergence_plot.png \
            0.3 "Global localization (A)" || true
          python3 $GITHUB_WORKSPACE/test/plot_convergence.py \
            /root/ros2_ws/recovery_b /root/ros2_ws/recovery_b/convergence_plot.png \
            0.3 "Wrong initial pose (B)" || true
        shell: bash
      - name: Upload recovery results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-eval
          path: |
            /root/ros2_ws/recovery_a/
            /root/ros2_ws/recovery_b/
          if-no-files-found: warn
      - name: Post recovery result to the PR
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 $GITHUB_WORKSPACE/test/post_recovery_eval.py \
            "Global localization (A)=/root/ros2_ws/recovery_a" \
            "Wrong initial pose (B)=/root/ros2_ws/recovery_b"
        shell: bash
