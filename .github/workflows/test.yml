name: test

on:
  push:
    branches:
      - jazzy
    paths-ignore:
    - '**.md'
  pull_request:
    branches:
      - jazzy
    paths-ignore:
    - '**.md'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: osrf/ros:jazzy-desktop-full
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p /root/ros2_ws/src
          cp -r $GITHUB_WORKSPACE /root/ros2_ws/src/emcl2_ros2
          cd /root/ros2_ws
          source /opt/ros/$ROS_DISTRO/setup.bash
          apt update
          rosdep update
          rosdep install -i -y --from-path src --rosdistro $ROS_DISTRO
          colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release
        shell: bash
      - name: Test
        run: |
          cd /root/ros2_ws
          source /opt/ros/$ROS_DISTRO/setup.bash
          colcon test
          colcon test-result --verbose
        shell: bash
