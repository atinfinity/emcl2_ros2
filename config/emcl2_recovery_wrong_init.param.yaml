/**:
  ros__parameters:
    transform_tolerance: 0.2
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    footprint_frame_id: "base_footprint"
    laser_min_range: 0.0
    laser_max_range: 100000000.0
    scan_increment: 1
    # Deliberately wrong initial pose (~1.7 m away and rotated ~0.6 rad from the
    # true start of -2.0, -0.5, 0.0). The filter must recover from this bad guess
    # via Expansion + Sensor Resetting while the robot drives -- a kidnapped-at-
    # start scenario. This offset is tuned so recovery *sometimes* succeeds
    # (a discriminating difficulty), rather than the earlier ~3.6 m / 180 deg
    # offset which never recovered and could not distinguish improvements.
    # Kept inside free space so particles are not born in a wall.
    initial_pose_x: -0.5
    initial_pose_y: 0.3
    initial_pose_a: 0.6
    num_particles: 2000
    alpha_threshold: 0.5
    expansion_radius_position: 0.1
    expansion_radius_orientation: 0.2
    extraction_rate: 0.1
    range_threshold: 0.3
    sensor_reset: true
    enable_expansion_resetting: true
    odom_fw_dev_per_fw: 0.19
    odom_fw_dev_per_rot: 0.0001
    odom_rot_dev_per_fw: 0.13
    odom_rot_dev_per_rot: 0.2
    laser_likelihood_max_dist: 0.1
